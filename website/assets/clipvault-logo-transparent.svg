<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 352" role="img" aria-labelledby="title desc">
  <title id="title">ClipVault logo</title>
  <desc id="desc">A cream clipboard with yellow and purple detail lines, isolated on a transparent background.</desc>

  <!-- Transparent canvas; no background shape is included. -->
  <g id="clipboard">
    <path
      id="clipboard-body"
      fill="#FBF7EF"
      stroke="#231F1C"
      stroke-width="12"
      stroke-linejoin="round"
      d="M42 48h172c19.9 0 36 16.1 36 36v226c0 19.9-16.1 36-36 36H42c-19.9 0-36-16.1-36-36V84c0-19.9 16.1-36 36-36Z"
    />

    <g id="clip">
      <path
        id="clip-base"
        fill="#FFC72C"
        stroke="#231F1C"
        stroke-width="12"
        stroke-linejoin="round"
        d="M92 30h72c11 0 20 9 20 20v22c0 11-9 20-20 20H92c-11 0-20-9-20-20V50c0-11 9-20 20-20Z"
      />
      <rect
        id="clip-grip"
        x="102"
        y="6"
        width="52"
        height="42"
        rx="15"
        fill="#FBF7EF"
        stroke="#231F1C"
        stroke-width="12"
      />
    </g>

    <g id="content-lines" fill="none" stroke-linecap="round">
      <path id="line-neutral-top" stroke="#E4DCCB" stroke-width="23" d="M53 131h150" />
      <path id="line-purple" stroke="#5B4DE0" stroke-width="23" d="M53 173h150" />
      <path id="line-neutral-middle" stroke="#E4DCCB" stroke-width="23" d="M53 215h109" />
      <path id="line-yellow" stroke="#FFC72C" stroke-width="23" d="M53 257h150" />
      <path id="line-neutral-bottom" stroke="#E4DCCB" stroke-width="23" d="M53 299h83" />
    </g>
  </g>
</svg>
